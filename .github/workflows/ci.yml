name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            cmake_gen: ""
            # Windows defaults to MSVC, which is what we want.
            # CMakeLists.txt handles MSVC specific flags.
            cmake_extra_args: ""
            install_swiftshader: true

          - name: Linux
            os: ubuntu-latest
            cmake_gen: "-G Ninja"
            # Installing Clang 21 as per user's environment
            cmake_extra_args: "-DCMAKE_C_COMPILER=clang-21 -DCMAKE_CXX_COMPILER=clang++-21"
            install_swiftshader: false

          - name: macOS
            os: macos-14 # Apple Silicon (M1/M2)
            cmake_gen: "-G Ninja"
            # Explicitly using Homebrew Clang 17
            cmake_extra_args: "-DCMAKE_C_COMPILER=$(brew --prefix llvm@17)/bin/clang -DCMAKE_CXX_COMPILER=$(brew --prefix llvm@17)/bin/clang++"
            install_swiftshader: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Setup Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.335.0
          cache: true
          install_swiftshader: ${{ matrix.install_swiftshader }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y ninja-build libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev mesa-vulkan-drivers libc++-21-dev libc++abi-21-dev

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja llvm@17

      - name: Configure CMake
        run: |
          cmake -S . -B build ${{ matrix.cmake_gen }} ${{ matrix.cmake_extra_args }} -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        env:
          # Explicitly point the loader to the ICDs.
          # Windows: Use the path provided by the setup action (SwiftShader)
          VK_ICD_FILENAMES: ${{ runner.os == 'Windows' && env.VK_DRIVER_FILES || (runner.os == 'macOS' && format('{0}/etc/vulkan/icd.d/MoltenVK_icd.json', env.VULKAN_SDK)) || '' }}
        run: ctest --test-dir build -C Release --output-on-failure
